services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CHROMA_DIR: /app/chroma_db
      TICKETS_PATH: /app/data/tickets.json
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend/data/tickets.json:/app/data/tickets.json
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data: